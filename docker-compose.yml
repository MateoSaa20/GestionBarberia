services:
  db:
    image: postgres:17
    container_name: barberia-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: barber
      POSTGRES_PASSWORD: barber
      POSTGRES_DB: barberia
    ports:
      - "5433:5432"
    volumes:
      - barberia_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barber -d barberia"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  barberia_pg:
